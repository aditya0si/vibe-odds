    <h3>Historical paper simulation — retrospective only</h3>
    <p>These are frozen <strong>2024–25 walk-forward simulation</strong> results, replayed on past matches with a half-Kelly

    advantage claim. Any threshold chosen on this window must be re-verified on prospective data.</p>
    <ul>
      <li>Column-set tournament gain +0.00082 mean Brier (4/4 folds positive).</li>
      <li>Adaptive confidence slice ≥65% confidence hit 76.9% (n=2318) in the replay.</li>
      <li>Paper-trading policies (retrospective units): bandit +11.04u; frozen ev≥0.03 +20.57u.</li>
    </ul>
    <p>Paper profit is not real profit. Historical A5 evaluation does not establish prospective A7 prediction performance.</p>
  </div>
</template>
