# NBA player-prop price capture (props board for the 2026-27 season).
#
# Two independent feeds, two jobs, deliberately separate so one missing secret
# never takes down the other:
#   props-board  -> SharpAPI, reachable from the local network, free tier
#                   (12 req/min, 2 books, 60s delay, pre-match). Cheap per run,
#                   so a frequent schedule is fine.
#   props-sgo    -> SportsGameOdds, blocked locally (Sophos gambling filter), so
#                   it must run here. Free tier meters OBJECTS (2,500/month), and
#                   each returned odd is an object — hence the weekly cadence and
#                   the oddIDs filter. Do not turn this into an hourly job.
#
# Secrets required (repo Settings -> Secrets and variables -> Actions):
#   SHARPAPI_KEY         free key from https://sharpapi.io/pricing
#   SPORTSGAMEODDS_KEY   free key from https://sportsgameodds.com/pricing
# A missing secret SKIPS its job with an explicit message (the capture tool exits
# 2 and prints the variable name) — it never fails closed on the other source.
#
# Nothing is committed by default. Raw payloads and the drop log ride out as
# build artifacts; use the manual "commit" input when you want the JSON in the
# repo (line-ladder history worth keeping).
name: props-capture

on:
  schedule:
    - cron: "20 */3 * * *"      # SharpAPI board: 8 board snapshots/day
    - cron: "40 6 * * 1"        # SportsGameOdds: one weekly cross-book snapshot
  workflow_dispatch:
    inputs:
      source:
        description: "Which feed to capture"
        type: choice
        options: [sharpapi, sportsgameodds, both]
        default: both
      dry_run:
        description: "Fetch and report without writing to the DB"
        type: boolean
        default: true
      dump_raw:
        description: "Archive the raw payload and upload it as an artifact"
        type: boolean
        default: true
      commit:
        description: "Commit captured JSON + drop log back to this branch"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  props-board:
    if: github.event.schedule != '40 6 * * 1'
    runs-on: ubuntu-latest
    env:
      SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install capture deps (the tool needs requests only)
        run: python -m pip install --quiet "requests==2.33.0"
      - name: Capture the SharpAPI prop board
        run: |
          python -m tools.props_capture capture --source sharpapi --limit 400
      - name: Report what prop_lines now holds
        if: always()
        run: python -m tools.props_capture report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: props-board-${{ github.run_id }}
          path: |
            sports/nba/data/raw/props/
            sports/nba/data/props_dropped.jsonl
          if-no-files-found: ignore
          retention-days: 30

  props-sgo:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '40 6 * * 1'
    runs-on: ubuntu-latest
    env:
      SPORTSGAMEODDS_KEY: ${{ secrets.SPORTSGAMEODDS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install capture deps
        run: python -m pip install --quiet "requests==2.33.0"
      - name: Capture the SportsGameOdds board (props are on every plan)
        run: |
          python -m tools.props_capture capture --source sportsgameodds --limit 20
      - name: Dump the raw payload for field-mapping verification
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import json, os, pathlib
          from core.providers import sportsgameodds as S
          try:
              payload = S.fetch_events(limit=3)
          except S.MissingKey as exc:
              print(f"SKIP: {exc}"); raise SystemExit(0)
          p = pathlib.Path("sports/nba/data/raw/props/sgo-sample.json")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(payload, indent=1)[:2_000_000])
          print("wrote", p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: props-sgo-${{ github.run_id }}
          path: |
            sports/nba/data/raw/props/
            sports/nba/data/props_dropped.jsonl
          if-no-files-found: ignore
          retention-days: 30

  commit-capture:
    needs: [props-board, props-sgo]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Replay captured JSON into the working tree
        run: |
          mkdir -p sports/nba/data/raw/props
          cp -R artifacts/*/sports/nba/data/raw/props/. sports/nba/data/raw/props/ 2>/dev/null || true
      - name: Commit
        run: |
          git config user.name  "props-capture[bot]"
          git config user.email "props-capture@users.noreply.github.com"
          git add -A sports/nba/data/raw/props
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "props: capture $(date -u +%FT%TZ)"
          git push
