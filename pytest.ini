[pytest]
# `slow` marks CPU-bound work (full sim / leakage sweeps). They are correct but take
# 18-35s on a fast machine and several minutes on a 2-vCPU CI runner, so they are
# excluded from the push/PR gate and run in the nightly `full` job instead.
markers =
    slow: CPU-bound simulation or leakage sweep; excluded from the PR gate
